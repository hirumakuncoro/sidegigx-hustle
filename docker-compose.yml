services:
  gigwatch:
    image: ${GIGWATCH_IMAGE:-ghcr.io/hirumakuncoro/sidegigx-hustle:latest}
    pull_policy: always
    container_name: gigwatch
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SIDEGIGX_CLAIM_TOKENS=${SIDEGIGX_CLAIM_TOKENS}
      - SIDEGIGX_CLAIM_TOKEN=${SIDEGIGX_CLAIM_TOKEN}
      - DB_PATH=/data/sidegigx.db
    volumes:
      - sidegigx-data:/data
    restart: unless-stopped

volumes:
  sidegigx-data:
